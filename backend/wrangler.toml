# AdvanCare API — Cloudflare Workers + Hono (ADV-CORE-001)
# Secrets are NEVER committed. Local: copy .env.example to .env (in backend/).
# Deployed secrets are managed separately with Wrangler (DEPLOY.md).
name = "advancare-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "development"
# In development any http://localhost:<port> is also allowed (see src/middleware/cors.ts).
ALLOWED_ORIGINS = "http://localhost:5174,http://127.0.0.1:5174"
R2_BUCKET_NAME = "advancare-uploads-dev"
# Staff console (admin/). Dev also allows any http://localhost:<port> (src/middleware/staff.ts).
ADMIN_ORIGINS = "http://localhost:5176"
ADMIN_APP_URL = "http://localhost:5176"

# Local development reaches Neon directly through DATABASE_URL (backend/.env).
# Hyperdrive is bound only in deployed environments; see [env.production].

# remote = true: `wrangler dev` reads the real dev bucket, the same one presigned
# uploads write to. Tests (vitest) keep using a local simulated bucket.
# If the Cloudflare remote proxy is unreachable, use `npm run dev:local` for
# auth/admin development. Its local bucket cannot read real presigned uploads.
[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "advancare-uploads-dev"
remote = true

# Care Assistant: 10 messages per minute per caller (protects the Gemini quota).
[[ratelimits]]
name = "ASSISTANT_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Staff sign-in: 10 attempts per minute per email (on top of the 5-strike lockout).
[[ratelimits]]
name = "ADMIN_LOGIN_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# App sign-in codes: 10 requests/attempts per minute per email.
[[ratelimits]]
name = "CLIENT_AUTH_LIMITER"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

# Per-IP sign-in limits are generous: a barangay hall, school or venue puts many phones
# behind one Wi-Fi/mobile IP, and they must not lock each other out.
[[ratelimits]]
name = "CLIENT_AUTH_IP_LIMITER"
namespace_id = "1004"
simple = { limit = 200, period = 60 }

[[ratelimits]]
name = "ADMIN_LOGIN_IP_LIMITER"
namespace_id = "1005"
simple = { limit = 100, period = 60 }

[env.production]
name = "advancare-api"
# Web apps on Cloudflare Pages and Vercel; both staff consoles proxy /api to this Worker.
vars = { ENVIRONMENT = "production", ALLOWED_ORIGINS = "https://advancare-app.pages.dev,https://advancare.vercel.app,capacitor://localhost,https://localhost", R2_BUCKET_NAME = "advancare-uploads", ADMIN_ORIGINS = "https://advancare-admin.pages.dev,https://advancare-admin.vercel.app", ADMIN_APP_URL = "https://advancare-admin.pages.dev", MAIL_FROM_NAME = "AdvanCare" }

# Hyperdrive "advancare-neon": Neon direct (unpooled) URL, query caching disabled so
# clinical and shift data are never served stale.
# Prototype phase: the live API uses the Neon demo branch ("advancare-neon-demo") so reviewers see
# the fictional demo data. For real use switch back to the production branch config:
#   id = "11c3b46c749a4eb8acbe2b7c7df8d5da"   # "advancare-neon" (production branch)
[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "953cafd868c14f8d8e9cf8611581ec2e"

[[env.production.ratelimits]]
name = "ASSISTANT_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[env.production.ratelimits]]
name = "ADMIN_LOGIN_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[env.production.ratelimits]]
name = "CLIENT_AUTH_LIMITER"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

[[env.production.ratelimits]]
name = "CLIENT_AUTH_IP_LIMITER"
namespace_id = "1004"
simple = { limit = 200, period = 60 }

[[env.production.ratelimits]]
name = "ADMIN_LOGIN_IP_LIMITER"
namespace_id = "1005"
simple = { limit = 100, period = 60 }

[[env.production.r2_buckets]]
binding = "UPLOADS"
bucket_name = "advancare-uploads"
