<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F7F9F5" />
    <link rel="icon" type="image/png" href="/logo-emblem.png" />
    <link rel="preload" as="image" href="/logo-emblem.png" />
    <title>AdvanCare — Care closer to every community | Cagayan Province</title>
    <meta
      name="description"
      content="AI-enabled healthcare management platform for grassroots communities in Cagayan. One closed care loop: affordable plans, RHU-led care, non-emergency transport, MediBox triage and multi-language TeleHealth."
    />
    <meta property="og:title" content="AdvanCare — Care closer to every community" />
    <meta
      property="og:description"
      content="From access to grassroots affordability to specialized healthcare, NO Cagayano Barangay resident left behind."
    />
    <meta property="og:image" content="/logo-full.png" />
    <meta property="og:type" content="website" />

    <!-- Preloader: inline so it paints before the app bundle loads -->
    <style>
      #ac-preloader {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #F7F9F5;
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        transition: opacity 500ms cubic-bezier(0.23, 1, 0.32, 1), visibility 0s linear 500ms;
      }
      #ac-preloader .ac-pl-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        transition: transform 500ms cubic-bezier(0.23, 1, 0.32, 1), opacity 400ms cubic-bezier(0.23, 1, 0.32, 1);
      }
      #ac-preloader .ac-pl-mark {
        position: relative;
        width: 84px;
        height: 84px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #ac-preloader .ac-pl-mark::before {
        content: "";
        position: absolute;
        inset: -10px;
        border-radius: 50%;
        background: #E3F0E8;
        animation: ac-pl-breathe 1.8s cubic-bezier(0.77, 0, 0.175, 1) infinite alternate;
      }
      #ac-preloader .ac-pl-mark img {
        position: relative;
        width: 64px;
        height: 64px;
        object-fit: contain;
        animation: ac-pl-beat 1.8s cubic-bezier(0.77, 0, 0.175, 1) infinite alternate;
      }
      #ac-preloader .ac-pl-word {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1;
        animation: ac-pl-rise 600ms cubic-bezier(0.23, 1, 0.32, 1) both;
      }
      #ac-preloader .ac-pl-sub {
        margin-top: -10px;
        font-size: 12px;
        font-weight: 600;
        color: #536D65;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        animation: ac-pl-rise 600ms cubic-bezier(0.23, 1, 0.32, 1) 80ms both;
      }
      #ac-preloader .ac-pl-bar {
        position: relative;
        width: 148px;
        height: 3px;
        border-radius: 9999px;
        background: #D3DFD7;
        overflow: hidden;
        animation: ac-pl-rise 600ms cubic-bezier(0.23, 1, 0.32, 1) 160ms both;
      }
      #ac-preloader .ac-pl-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(90deg, #086B5B, #149361);
        animation: ac-pl-slide 1.1s cubic-bezier(0.77, 0, 0.175, 1) infinite;
      }
      #ac-preloader.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #ac-preloader.is-done .ac-pl-inner {
        transform: scale(0.96) translateY(-6px);
        opacity: 0;
      }
      @keyframes ac-pl-breathe {
        from { transform: scale(0.92); opacity: 0.7; }
        to { transform: scale(1.06); opacity: 1; }
      }
      @keyframes ac-pl-beat {
        from { transform: scale(0.97); }
        to { transform: scale(1.03); }
      }
      @keyframes ac-pl-rise {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes ac-pl-slide {
        from { transform: translateX(-100%); }
        to { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #ac-preloader .ac-pl-mark::before,
        #ac-preloader .ac-pl-mark img { animation: none; }
        #ac-preloader .ac-pl-word,
        #ac-preloader .ac-pl-sub,
        #ac-preloader .ac-pl-bar { animation: none; }
        #ac-preloader .ac-pl-bar::after { animation-duration: 2.2s; }
        #ac-preloader.is-done .ac-pl-inner { transform: none; }
      }
      html.ac-loading body { overflow: hidden; }
    </style>
  </head>
  <body>
    <script>document.documentElement.classList.add('ac-loading');</script>
    <div id="ac-preloader" role="status" aria-live="polite" aria-label="Loading AdvanCare">
      <div class="ac-pl-inner">
        <div class="ac-pl-mark"><img src="/logo-emblem.png" alt="" /></div>
        <div class="ac-pl-word"><span style="color:#075582">Advan</span><span style="color:#149361">Care</span></div>
        <div class="ac-pl-sub">For families. With communities.</div>
        <div class="ac-pl-bar" aria-hidden="true"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
